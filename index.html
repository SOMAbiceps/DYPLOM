<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Przegląd kina - Kino Muza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    body { 
      font-family: Arial, Helvetica, sans-serif;
      background: #120a8f; 
      color: #f5f5f5; 
      min-height: 100vh;
    }
    
    /* HEADLINE */
    .headline {
      width: 100%;
      text-align: center;
      padding: 40px 20px;
      background: #0a0654;
      border-bottom: 2px solid #1e1aa0;
    }
    
    .headline h1 {
      font-size: 48px;
      font-weight: bold;
      font-family: 'Helvetica', Arial, sans-serif;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 10px;
    }
    
    .headline p {
      font-size: 28px;
      font-family: 'Garamond', Georgia, serif;
      color: #fff;
      letter-spacing: 2px;
    }
    
    /* GRID VIEW - główny widok z kafelkami */
    .grid-view {
      display: block;
      padding: 40px 0;
      max-width: 480px;
      margin: 0 auto;
    }
    
    .grid-view.hidden {
      display: none;
    }
    
    .directors-grid {
      display: flex;
      flex-direction: column;
      background: #f2f2f2;
      overflow: hidden;
    }
    
    .director-card {
      background: #f2f2f2;
      cursor: pointer;
      border-bottom: 1px solid #d0d0d0;
    }
    
    .director-card:last-child {
      border-bottom: none;
    }
    
    .director-card-name {
      padding: 22px 24px;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Helvetica', Arial, sans-serif; /* Helvetica Bold */
      color: #111;
    }
    
    .director-card-name::after {
      content: "›";
      font-size: 20px;
    }
    
    /* DETAIL VIEW - pełnoekranowy widok szczegółów */
    .detail-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #120a8f;
      z-index: 1000;
      overflow-y: auto;
      animation: slideIn 0.4s ease;
    }
    
    .detail-view.active {
      display: block;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .detail-header {
      position: relative;
      height: 50vh;
      overflow: hidden;
    }
    
    .detail-background {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.4);
    }
    
    .detail-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px;
      background: rgba(18, 10, 143, 0.9);
    }
    
    .detail-name {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 10px;
      font-family: 'Helvetica', Arial, sans-serif;
    }
    
    .detail-bio {
      font-size: 18px;
      color: #ccc;
      max-width: 800px;
      line-height: 1.6;
      font-family: 'Garamond', Georgia, serif; /* Garamond */
    }
    
    .back-button {
      position: absolute;
      background: rgba(10, 6, 84, 0.9);
      border: 2px solid #4d45ff;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      z-index: 1001;
    }
    
    .back-button:hover {
      background: #4d45ff;
      transform: translateX(-5px);
    }

    .back-button {
      top: 30px;
      left: 30px;
    }
    
    .filmography {
      padding: 60px 40px;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }
    
    .filmography-title {
      font-size: 36px;
      margin-bottom: 40px;
      font-weight: bold;
      border-bottom: 2px solid #1e1aa0;
      padding-bottom: 20px;
    }
    
    .film-item {
      background: #1a15a0;
      padding: 25px 30px;
      margin-bottom: 20px;
      border-left: 4px solid #4d45ff;
    }
    
    .film-year {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 8px;
    }
    
    .film-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    
    .film-runtime {
      color: #ccc;
      font-size: 14px;
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      .headline h1 {
        font-size: 28px;
        letter-spacing: 2px;
      }
      
      .headline p {
        font-size: 20px;
        letter-spacing: 1px;
      }
      
      .grid-view {
        padding: 10px 0 30px 0;
        max-width: 414px;
      }
      
      .director-card-name {
        font-size: 20px;
        padding: 24px 24px;
      }
      
      .detail-name {
        font-size: 36px;
      }
      
      .detail-bio {
        font-size: 16px;
      }
      
      .detail-overlay {
        padding: 20px;
      }
      
      .filmography {
        padding: 40px 20px;
      }
      
      .filmography-title {
        font-size: 28px;
      }
      
      .film-title {
        font-size: 20px;
      }
      
      .back-button {
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="headline">
    <h1>Przegląd kina</h1>
    <p>W Kinie Muza</p>
  </div>

  <!-- GRID VIEW -->
  <div class="grid-view" id="gridView">
    <div class="directors-grid">
      <div class="director-card" data-director="lynch">
        <div class="director-card-name">David Lynch</div>
      </div>
      
      <div class="director-card" data-director="zulawski">
        <div class="director-card-name">Andrzej Żuławski</div>
      </div>
      
      <div class="director-card" data-director="tarantino">
        <div class="director-card-name">Quentin Tarantino</div>
      </div>
      
      <div class="director-card" data-director="coppola">
        <div class="director-card-name">Sofia Coppola</div>
      </div>
      
      <div class="director-card" data-director="eggers">
        <div class="director-card-name">Robert Eggers</div>
      </div>
    </div>
  </div>

  <!-- DETAIL VIEW -->
  <div class="detail-view" id="detailView">
    <button class="back-button" id="backButton">← Powrót</button>
    
    <div class="detail-header">
      <img id="detailBackground" src="" alt="" class="detail-background">
      <div class="detail-overlay">
        <div class="detail-name" id="detailName"></div>
        <div class="detail-bio" id="detailBio"></div>
      </div>
    </div>
    
    <div class="filmography">
      <div class="filmography-title">Filmografia</div>
      <div id="filmographyList"></div>
    </div>
  </div>

  <script>
    // Dane reżyserów
    const directors = {
      lynch: {
        name: "David Lynch",
        bio: "Amerykański reżyser, scenarzysta i artysta wizualny. Mistrz surrealizmu i kina autorskiego, twórca kultowych dzieł pełnych symboliki i onirycznej atmosfery.",
        image: "lynch.jpg",
        films: [
          { year: 1977, title: "Eraserhead", runtime: "89 min" },
          { year: 1986, title: "Blue Velvet", runtime: "120 min" },
          { year: 1992, title: "Fire Walk with Me", runtime: "135 min" },
          { year: 2001, title: "Mulholland Drive", runtime: "147 min" }
        ]
      },
      zulawski: {
        name: "Andrzej Żuławski",
        bio: "Polski reżyser i scenarzysta, jeden z najważniejszych twórców kina artystycznego. Znany z intensywnych, emocjonalnych filmów balansujących na granicy szaleństwa i geniuszu.",
        image: "zulawski.jpg",
        films: [
          { year: 1971, title: "Trzecia część nocy", runtime: "116 min" },
          { year: 1981, title: "Opętanie", runtime: "124 min" },
          { year: 1988, title: "Na srebrnym globie", runtime: "166 min" },
          { year: 1996, title: "Szamanka", runtime: "130 min" }
        ]
      },
      tarantino: {
        name: "Quentin Tarantino",
        bio: "Amerykański reżyser, scenarzysta i aktor. Rewolucjonista kina lat 90., znany z charakterystycznych dialogów, nielinearnej narracji i hołdów dla kina gatunkowego.",
        image: "tarantino.jpg",
        films: [
          { year: 1992, title: "Reservoir Dogs", runtime: "99 min" },
          { year: 1994, title: "Pulp Fiction", runtime: "154 min" },
          { year: 2003, title: "Kill Bill Vol. 1", runtime: "111 min" },
          { year: 2012, title: "Django Unchained", runtime: "165 min" }
        ]
      },
      coppola: {
        name: "Sofia Coppola",
        bio: "Amerykańska reżyserka i scenarzystka, córka Francisa Forda Coppoli. Tworzy intymne, subtelne filmy o kobiecym doświadczeniu, samotności i poszukiwaniu tożsamości.",
        image: "Coppola.jpg",
        films: [
          { year: 1999, title: "The Virgin Suicides", runtime: "97 min" },
          { year: 2003, title: "Lost in Translation", runtime: "102 min" },
          { year: 2006, title: "Marie Antoinette", runtime: "123 min" },
          { year: 2023, title: "Priscilla", runtime: "113 min" }
        ]
      },
      eggers: {
        name: "Robert Eggers",
        bio: "Amerykański reżyser i scenarzysta, mistrz gotyckiego horroru i kina historycznego. Znany z drobiazgowej dbałości o detale i autentyczność historyczną swoich wizji.",
        image: "Eggers.jpg",
        films: [
          { year: 2015, title: "The Witch", runtime: "92 min" },
          { year: 2019, title: "The Lighthouse", runtime: "109 min" },
          { year: 2022, title: "The Northman", runtime: "137 min" }
        ]
      }
    };

    // Elementy DOM
    const gridView = document.getElementById('gridView');
    const detailView = document.getElementById('detailView');
    const backButton = document.getElementById('backButton');
    const directorCards = document.querySelectorAll('.director-card');

    // Funkcja pokazująca szczegóły reżysera
    function showDirector(directorId) {
      try {
        const director = directors[directorId];
        if (!director) throw new Error(`Brak danych dla reżysera: ${directorId}`);

        document.getElementById('detailName').textContent = director.name;
        document.getElementById('detailBio').textContent = director.bio;
        document.getElementById('detailBackground').src = director.image;
        document.getElementById('detailBackground').alt = director.name;

        const filmographyList = document.getElementById('filmographyList');
        filmographyList.innerHTML = '';
        director.films.forEach(film => {
          const filmItem = document.createElement('div');
          filmItem.className = 'film-item';
          filmItem.innerHTML = `
            <div class="film-year">${film.year}</div>
            <div class="film-title">${film.title}</div>
            <div class="film-runtime">${film.runtime}</div>
          `;
          filmographyList.appendChild(filmItem);
        });

        gridView.classList.add('hidden');
        detailView.classList.add('active');
        window.scrollTo(0, 0);

      } catch (error) {
        console.error('Błąd wyświetlania reżysera:', error);
        alert('Nie udało się załadować informacji o reżyserze');
      }
    }

    // Funkcja powrotu do siatki
    function showGrid() {
      detailView.classList.remove('active');
      gridView.classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    // Event listenery
    directorCards.forEach(card => {
      card.addEventListener('click', () => showDirector(card.getAttribute('data-director')));
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');
      card.addEventListener('keypress', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          showDirector(card.getAttribute('data-director'));
        }
      });
    });

    backButton.addEventListener('click', showGrid);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && detailView.classList.contains('active')) showGrid();
    });

    console.log('Strona załadowana pomyślnie');
  </script>
</body>
</html>
